name: Apply Rafa brand typography

on:
  push:
    branches:
      - rafa-brand-typography-logo-20260915
    paths:
      - .github/workflows/apply-rafa-brand.yml

permissions:
  contents: write

jobs:
  apply-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rafa-brand-typography-logo-20260915

      - name: Apply logo and typography
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          LOGO_B64 = """"""
          logo_uri = "data:image/webp;base64," + LOGO_B64
          fonts = '''<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">'''

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Pattern not found: {label}")
              return text.replace(old, new, 1)

          p = Path("index.html")
          t = p.read_text(encoding="utf-8")
          t = replace_once(t, '<meta name="theme-color" content="#5B1F2A">', '<meta name="theme-color" content="#5B1F2A">\n' + fonts, "index fonts")
          t = t.replace('font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;', 'font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;', 1)
          t = replace_once(t, '''.brand{text-decoration:none;display:inline-flex;flex-direction:column;gap:1px}\n.brand strong{\ncolor:var(--wine);\nfont-family:Georgia,"Times New Roman",serif;\nfont-size:25px;\nfont-weight:500;\nletter-spacing:-.02em;\n}\n.brand span{\ncolor:var(--muted);\nfont-size:9px;\nfont-weight:800;\nletter-spacing:.11em;\ntext-transform:uppercase;\n}''', '''.brand{\ntext-decoration:none;\ndisplay:inline-flex;\nalign-items:center;\ngap:11px;\nmin-width:0;\n}\n.brand-mark{\ndisplay:grid;\nplace-items:center;\nwidth:126px;\nheight:52px;\npadding:7px 13px;\nborder-radius:16px;\nbackground:var(--wine);\nbox-shadow:0 7px 18px rgba(91,31,42,.12);\nflex:0 0 auto;\n}\n.brand-mark img{display:block;width:100%;height:100%;object-fit:contain}\n.brand-copy{display:flex;flex-direction:column;gap:1px;min-width:0}\n.brand-copy strong{\ncolor:var(--wine);\nfont-size:10px;\nfont-weight:800;\nletter-spacing:.10em;\ntext-transform:uppercase;\nwhite-space:nowrap;\n}\n.brand-copy span{\ncolor:var(--muted);\nfont-size:8px;\nfont-weight:700;\nletter-spacing:.09em;\ntext-transform:uppercase;\nwhite-space:nowrap;\n}''', "index brand css")
          t = replace_once(t, 'h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--wine);font-weight:500}', 'h1,h2{font-family:"Kalam","Segoe Print","Bradley Hand",cursive;color:var(--wine);font-weight:700}\nh3{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--wine);font-weight:800}', "index headings")
          t = t.replace('line-height:.96;', 'line-height:1.02;', 1).replace('letter-spacing:-.045em;', 'letter-spacing:-.025em;', 1)
          t = replace_once(t, '''.section-title{\nfont-size:clamp(31px,4vw,45px);\nletter-spacing:-.025em;\nmargin:0 0 10px;\n}''', '''.section-title{\nfont-size:clamp(32px,4.2vw,48px);\nline-height:1.05;\nletter-spacing:-.015em;\nmargin:0 0 10px;\n}''', "index section title")
          t = t.replace('font-family:Georgia,"Times New Roman",serif;\nfont-size:22px;\nfont-weight:500;', 'font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;\nfont-size:20px;\nfont-weight:800;', 1)
          t = t.replace('font-family:Georgia,"Times New Roman",serif;\nfont-size:36px;\nfont-weight:500;', 'font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;\nfont-size:34px;\nfont-weight:800;', 1)
          t = t.replace('.estimate-box strong{display:block;color:var(--wine);font-family:Georgia,serif;font-size:27px;font-weight:500;margin-top:4px}', '.estimate-box strong{display:block;color:var(--wine);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:25px;font-weight:800;margin-top:4px}', 1)
          t = t.replace('.pizza-name{font-family:Georgia,serif;color:var(--wine);font-size:17px}', '.pizza-name{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--wine);font-size:15px;font-weight:800}', 1)
          t = replace_once(t, '''<a class="brand" href="./index.html" aria-label="Rafa Pizza, accueil">\n<strong>Rafa Pizza</strong>\n<span>Pizza à domicile · événements</span>\n</a>''', f'''<a class="brand" href="./index.html" aria-label="Rafa Pizza, accueil">\n<span class="brand-mark"><img src="{logo_uri}" alt="Rafa"></span>\n<span class="brand-copy"><strong>Pizza à domicile</strong><span>Événements</span></span>\n</a>''', "index brand html")
          t = replace_once(t, '''.brand span{display:none}\n.site-header{padding:14px 15px}\n.brand strong{font-size:22px}''', '''.brand-copy{display:none}\n.brand-mark{width:108px;height:45px;padding:6px 11px;border-radius:14px}\n.site-header{padding:12px 15px}''', "index mobile brand")
          p.write_text(t, encoding="utf-8")

          p = Path("reserve.html")
          t = p.read_text(encoding="utf-8")
          t = replace_once(t, '<meta name="theme-color" content="#5B1F2A">', '<meta name="theme-color" content="#5B1F2A">\n' + fonts, "reserve fonts")
          t = t.replace('font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;', 'font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;', 1)
          t = replace_once(t, '''.brand{text-decoration:none}\n.brand strong{\ncolor:var(--wine);\nfont-family:Georgia,"Times New Roman",serif;\nfont-size:24px;\nfont-weight:500;\n}''', '''.brand{text-decoration:none;display:inline-flex;align-items:center}\n.brand-mark{\ndisplay:grid;\nplace-items:center;\nwidth:116px;\nheight:48px;\npadding:6px 12px;\nborder-radius:15px;\nbackground:var(--wine);\nbox-shadow:0 7px 18px rgba(91,31,42,.12);\n}\n.brand-mark img{display:block;width:100%;height:100%;object-fit:contain}''', "reserve brand css")
          t = replace_once(t, 'h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--wine);font-weight:500}', 'h1,h2{font-family:"Kalam","Segoe Print","Bradley Hand",cursive;color:var(--wine);font-weight:700}\nh3{font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--wine);font-weight:800}', "reserve headings")
          t = t.replace('h1{font-size:clamp(34px,6vw,52px);letter-spacing:-.035em;margin:0 0 10px;line-height:1}', 'h1{font-size:clamp(36px,6vw,54px);letter-spacing:-.018em;margin:0 0 10px;line-height:1.05}', 1)
          t = t.replace('.date-card strong{color:var(--wine);font-family:Georgia,serif;font-size:21px;font-weight:500}', '.date-card strong{color:var(--wine);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:19px;font-weight:800}', 1)
          t = t.replace('.timeline-step strong{display:block;color:var(--wine);font-family:Georgia,serif;font-size:16px;font-weight:500}', '.timeline-step strong{display:block;color:var(--wine);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;font-weight:800}', 1)
          t = replace_once(t, '<a class="brand" href="./index.html"><strong>Rafa Pizza</strong></a>', f'<a class="brand" href="./index.html" aria-label="Rafa Pizza, accueil"><span class="brand-mark"><img src="{logo_uri}" alt="Rafa"></span></a>', "reserve brand html")
          t = replace_once(t, '''.top{padding:15px}\n.brand strong{font-size:21px}''', '''.top{padding:13px 15px}\n.brand-mark{width:102px;height:42px;padding:5px 10px;border-radius:13px}''', "reserve mobile brand")
          p.write_text(t, encoding="utf-8")
          PY

      - name: Validate generated pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ("index.html", "reserve.html"):
              text = Path(name).read_text(encoding="utf-8")
              assert 'font-family:"Manrope"' in text
              assert 'font-family:"Kalam"' in text
              assert 'data:image/webp;base64,' in text
              assert text.count('alt="Rafa"') == 1
              ids = re.findall(r'\bid="([^"]+)"', text)
              assert len(ids) == len(set(ids)), f"Duplicate id in {name}"
              scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
              js = "\n".join(scripts)
              tmp = Path("/tmp") / (name + ".js")
              tmp.write_text(js, encoding="utf-8")
              subprocess.run(["node", "--check", str(tmp)], check=True)
          PY

      - name: Commit brand update
        shell: bash
        run: |
          git config user.name "Rafa site automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html reserve.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harmonise la typographie et intègre le logo Rafa"
          git push origin HEAD:rafa-brand-typography-logo-20260915
