<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Réserver — Rafa Pizza
</title>


<style>

:root{

  --cream:#F6F0E7;
  --cream2:#FBF8F3;
  --wine:#5B1F2A;
  --wine2:#7A2D3C;
  --ink:#2B2524;
  --muted:#8A7D77;
  --line:rgba(91,31,42,.16);

}


*{
  box-sizing:border-box;
}


html,
body{

  margin:0;
  padding:0;
  min-height:100%;

  background:var(--cream);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--ink);

}


body{

  min-height:100vh;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:24px;

}


.card{

  width:100%;

  max-width:600px;

  background:var(--cream2);

  border:
    1px solid
    var(--line);

  border-radius:28px;

  padding:
    46px
    34px;

  text-align:center;

  box-shadow:
    0
    18px
    45px
    rgba(65,35,39,.10);

}


.eyebrow{

  font-size:12px;

  letter-spacing:.18em;

  text-transform:uppercase;

  color:var(--wine2);

  font-weight:700;

  margin-bottom:16px;

}


h1{

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color:var(--wine);

  font-size:
    clamp(
      38px,
      8vw,
      58px
    );

  line-height:1;

  font-weight:500;

  margin:
    0
    0
    18px;

}


.date{

  color:var(--wine);

  font-size:19px;

  font-weight:800;

  margin-bottom:14px;

}


p{

  color:var(--muted);

  font-size:15px;

  line-height:1.55;

  margin:
    0
    auto
    30px;

  max-width:430px;

}


.button{

  display:flex;

  align-items:center;
  justify-content:center;

  width:100%;

  min-height:58px;

  padding:
    15px
    24px;

  border-radius:999px;

  background:var(--wine);

  color:var(--cream2);

  font-size:16px;

  font-weight:800;

  text-decoration:none;

  -webkit-tap-highlight-color:
    transparent;

  touch-action:
    manipulation;

}


.button:active{

  transform:
    scale(.98);

}


.back{

  display:inline-block;

  margin-top:22px;

  color:var(--muted);

  font-size:13px;

  text-decoration:none;

}


@media(max-width:600px){

  body{
    padding:16px;
  }


  .card{

    padding:
      38px
      22px;

    border-radius:22px;

  }

}

</style>

</head>



<body>


<div class="card">


  <div class="eyebrow">
    Rafa Pizza · Réservations
  </div>


  <h1>
    Réserver votre soirée
  </h1>


  <div
    class="date"
    id="selectedDate"
  ></div>


  <p>

    Appuyez sur le bouton
    ci-dessous pour nous envoyer
    votre demande de réservation.

  </p>


  <a
    id="emailButton"
    class="button"
    href="#"
  >
    Envoyer ma demande
  </a>


  <a
    class="back"
    href="index.html"
  >
    ← Retour au calendrier
  </a>


</div>



<script>

/* =========================================
   CONFIGURATION
========================================= */

const YEAR =
  2026;


const RAFA_EMAIL =
  "lapizzaderafa@gmail.com";


const monthNames = [

  "Janvier",
  "Février",
  "Mars",
  "Avril",
  "Mai",
  "Juin",
  "Juillet",
  "Août",
  "Septembre",
  "Octobre",
  "Novembre",
  "Décembre"

];


/* =========================================
   RÉCUPÉRER LA DATE CHOISIE
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const day =
  params.get(
    "day"
  );


const month =
  params.get(
    "month"
  );


let dateText =
  "";


/* =========================================
   AFFICHER LA DATE
========================================= */

if(
  day !== null &&
  month !== null &&
  monthNames[
    Number(month)
  ]
){

  dateText =

    day +
    " " +
    monthNames[
      Number(month)
    ] +
    " " +
    YEAR;


  document
    .getElementById(
      "selectedDate"
    )
    .textContent =
      dateText;

}


/* =========================================
   OBJET DU COURRIEL
========================================= */

const subject =

  dateText

  ? "Réservation Rafa Pizza — " +
    dateText

  : "Réservation Rafa Pizza";


/* =========================================
   CONTENU DU COURRIEL
========================================= */

const body =

  dateText

  ? `Bonjour Rafa,

J'aimerais réserver une soirée Rafa Pizza le ${dateText}.

Nombre de personnes :
Ville / secteur :
Heure souhaitée :
Téléphone :

Merci!`

  : `Bonjour Rafa,

J'aimerais réserver une soirée Rafa Pizza.

Date souhaitée :
Nombre de personnes :
Ville / secteur :
Heure souhaitée :
Téléphone :

Merci!`;


/* =========================================
   VRAI LIEN MAILTO
========================================= */

const mailto =

  "mailto:" +
  RAFA_EMAIL +

  "?subject=" +
  encodeURIComponent(
    subject
  ) +

  "&body=" +
  encodeURIComponent(
    body
  );


document
  .getElementById(
    "emailButton"
  )
  .href =
    mailto;

</script>


</body>

</html>
