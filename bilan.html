<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rafa — Bilan annuel</title><style>:root{--c:#F6F0E7;--w:#5B1F2A;--m:#8A7D77;--l:rgba(91,31,42,.16)}*{box-sizing:border-box}body{margin:0;background:#eee8df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2B2524}.app{max-width:850px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.head h1{font-family:Georgia,serif;color:var(--w);margin:0}.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:800;text-decoration:none;cursor:pointer;background:#fff;color:var(--w);border:1px solid var(--l)}.primary{background:var(--w);color:#fff}.panel{background:var(--c);border:1px solid var(--l);border-radius:22px;margin-top:16px;overflow:hidden}.ph{padding:18px;border-bottom:1px solid var(--l)}.ph h2{font-family:Georgia,serif;color:var(--w);margin:0}.body{padding:16px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--l)}.row input{width:22px;height:22px;accent-color:var(--w)}.date,.note{font-size:12px;color:var(--m)}.amount{font-weight:900;color:var(--w)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.summary{background:#fff;border-radius:16px;padding:14px;margin-top:12px;display:flex;justify-content:space-between;gap:10px}.login{max-width:420px;margin:20vh auto;background:var(--c);padding:25px;border-radius:24px;text-align:center}.login input{width:100%;padding:13px;border:1px solid var(--l);border-radius:12px;margin:10px 0}.hidden{display:none!important}@media(max-width:600px){.app{padding:12px}.head .btn{width:100%}.row{grid-template-columns:auto 1fr}.amount{grid-column:2}.tools .btn{flex:1}}</style></head><body><div id="login" class="login"><h1 style="font-family:Georgia;color:#5B1F2A">Rafa Pizza</h1><input id="pw" type="password" placeholder="Mot de passe"><button id="loginBtn" class="btn primary">Se connecter</button><div id="msg" class="note"></div></div><main id="app" class="app hidden"><div class="head"><div><h1>Bilan annuel</h1><div class="note">Choisis uniquement les événements à inclure dans le PDF. Ceci ne modifie aucun chiffre dans Finances.</div></div><a href="finances.html" class="btn">← Finances</a></div><section class="panel"><div class="ph"><h2>Événements à déclarer</h2></div><div class="body"><div class="tools"><select id="year" class="btn"></select><button id="all" class="btn">Tout cocher</button><button id="none" class="btn">Tout décocher</button></div><div id="events"></div><div class="summary"><span>Revenus sélectionnés</span><strong id="total">0 $</strong></div><div class="tools"><button id="pdf" class="btn primary">Créer le PDF du bilan</button></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script>const U='https://jetogsbyptglaihktdel.supabase.co',K='sb_publishable_YQndqxq2W7Bq2C-0crv0rQ_V4Upvbja',E='raphael.frenette@gmail.com',db=supabase.createClient(U,K),$=x=>document.getElementById(x);let rs=[],xs=[];const money=v=>new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD'}).format(v||0);function price(r){if(r.quoted_price!==null&&r.quoted_price!==undefined&&r.quoted_price!=='')return +r.quoted_price||0;let g=+r.guest_count,p,f;if(!g)return 0;if(g<=10){p=29;f=175}else if(g<=15){p=27;f=200}else if(g<=20){p=25;f=250}else if(g<=25){p=23;f=300}else if(g<=30){p=22;f=350}else if(g<=40){p=21;f=400}else if(g<=50){p=20;f=500}else if(g<=75){p=19;f=600}else{p=18;f=750}return g*p+f}async function gate(){let{data:{session}}=await db.auth.getSession();if(session&&(session.user.email||'').toLowerCase()===E){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}}$('loginBtn').onclick=async()=>{let{error}=await db.auth.signInWithPassword({email:E,password:$('pw').value});if(error)$('msg').textContent='Connexion impossible';else gate()};async function load(){let[a,b]=await Promise.all([db.from('reservations').select('*').order('event_date'),db.from('expenses').select('*')]);rs=(a.data||[]).filter(r=>r.status==='confirmed'&&+r.guest_count>0);xs=b.data||[];let ys=[...new Set(rs.map(r=>r.event_date?.slice(0,4)).filter(Boolean))].sort().reverse();$('year').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');render()}function render(){let y=$('year').value,rows=rs.filter(r=>r.event_date?.startsWith(y));$('events').innerHTML=rows.map(r=>`<label class="row"><input class="pick" type="checkbox" data-id="${r.id}" checked><div><strong>${r.full_name||'Événement'}</strong><div class="date">${r.event_date} · ${r.city||''}</div></div><div class="amount">${money(price(r))}</div></label>`).join('');document.querySelectorAll('.pick').forEach(x=>x.onchange=sum);sum()}function selected(){let ids=new Set([...document.querySelectorAll('.pick:checked')].map(x=>String(x.dataset.id)));return rs.filter(r=>ids.has(String(r.id)))}function sum(){$('total').textContent=money(selected().reduce((s,r)=>s+price(r),0))}$('year').onchange=render;$('all').onclick=()=>{document.querySelectorAll('.pick').forEach(x=>x.checked=true);sum()};$('none').onclick=()=>{document.querySelectorAll('.pick').forEach(x=>x.checked=false);sum()};$('pdf').onclick=()=>{let rows=selected(),y=$('year').value,rev=rows.reduce((s,r)=>s+price(r),0),exp=xs.filter(e=>e.expense_date?.startsWith(y)).reduce((s,e)=>s+(+e.amount||0),0),km=rows.reduce((s,r)=>s+(+r.business_km||0),0),{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'letter'}),py=20;d.setFont('helvetica','bold');d.setFontSize(22);d.text('RAFA - BILAN '+y,18,py);py+=14;d.setFontSize(11);d.text('Revenus des evenements selectionnes: '+money(rev),18,py);py+=7;d.text('Depenses saisies: '+money(exp),18,py);py+=7;d.text('Net estime: '+money(rev-exp),18,py);py+=7;d.text('Kilometrage des evenements selectionnes: '+km.toFixed(1)+' km',18,py);py+=14;d.setFontSize(14);d.text('Revenus par evenement',18,py);py+=8;d.setFont('helvetica','normal');d.setFontSize(9);rows.forEach(r=>{if(py>265){d.addPage();py=20}d.text((r.event_date+'  '+(r.full_name||'Evenement')).slice(0,75),18,py);d.text(money(price(r)),198,py,{align:'right'});py+=6});d.save('Rafa-Bilan-'+y+'.pdf')};gate();</script></body></html>
