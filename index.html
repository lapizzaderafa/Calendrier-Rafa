<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendrier Rafa — Automne 2026</title>

<style>
:root{
  --cream:#F6F0E7;
  --cream2:#FBF8F3;
  --wine:#5B1F2A;
  --wine2:#7A2D3C;
  --ink:#2B2524;
  --muted:#8A7D77;
  --line:rgba(91,31,42,.16);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  background:transparent;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
}

body{
  padding:12px;
}

/* CONTENEUR PRINCIPAL */

.shell{
  width:100%;
  max-width:1080px;
  margin:auto;
  background:var(--cream);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:0 18px 45px rgba(65,35,39,.10);
  overflow:hidden;
}

/* HEADER */

.top{
  padding:28px 30px 18px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid var(--line);
}

.eyebrow{
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--wine2);
  font-weight:700;
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--wine);
  font-size:clamp(34px,5vw,58px);
  line-height:.95;
  margin:6px 0 0;
  font-weight:500;
}

.subtitle{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

/* BOUTONS MOIS */

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:1px solid var(--line);
  background:var(--cream2);
  color:var(--wine);
  border-radius:999px;
  padding:10px 15px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}

button:hover{
  transform:translateY(-1px);
}

button.active{
  background:var(--wine);
  color:var(--cream2);
  border-color:var(--wine);
}

/* LÉGENDE */

.legend{
  padding:14px 30px;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--muted);
  border-bottom:1px solid var(--line);
}

.legend-item{
  display:flex;
  align-items:center;
  gap:7px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  flex-shrink:0;
}

.available{
  background:var(--wine2);
}

.booked-dot{
  background:var(--wine);
}

.unavailable-dot{
  background:#B9ADA6;
}

/* CALENDRIER */

.wrap{
  padding:22px 24px 26px;
}

.weekdays,
.grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
}

.weekdays{
  margin-bottom:8px;
}

.weekday{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:7px 2px;
}

.day{
  min-width:0;
  min-height:118px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.35);
  padding:12px;
  position:relative;
  transition:.18s ease;
  -webkit-tap-highlight-color:transparent;
}

.day.available-day{
  cursor:pointer;
}

.day.available-day:hover{
  border-color:rgba(91,31,42,.40);
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(65,35,39,.08);
}

.day.available-day:active{
  transform:scale(.97);
}

.day.empty{
  background:transparent;
  border:1px dashed rgba(91,31,42,.08);
  box-shadow:none;
  transform:none;
  pointer-events:none;
}

.num{
  font-size:16px;
  font-weight:800;
  color:var(--wine);
}

.status{
  position:absolute;
  left:12px;
  right:12px;
  bottom:11px;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  font-weight:800;
}

/* RÉSERVÉ */

.day.booked{
  background:var(--wine);
  border-color:var(--wine);
}

.day.booked .num,
.day.booked .status{
  color:var(--cream2);
}

.day.booked .dot{
  background:var(--cream2);
}

/* INDISPONIBLE */

.day.unavailable{
  background:rgba(185,173,166,.18);
}

.day.unavailable .num,
.day.unavailable .status{
  color:#8B817C;
}

/* FOOTER */

.footer{
  padding:0 24px 24px;
  color:var(--muted);
  font-size:11px;
  text-align:center;
  line-height:1.5;
}

/* ==============================
   TABLETTE
   ============================== */

@media(max-width:760px){

  body{
    padding:4px;
  }

  .shell{
    border-radius:20px;
  }

  .top{
    padding:22px 18px 16px;
    align-items:flex-start;
    flex-direction:column;
    gap:18px;
  }

  h1{
    font-size:38px;
  }

  .subtitle{
    font-size:13px;
  }

  .controls{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
  }

  button{
    width:100%;
    padding:11px 4px;
    font-size:12px;
  }

  .legend{
    padding:12px 18px;
    gap:12px;
  }

  .wrap{
    padding:14px 8px 18px;
  }

  .weekdays,
  .grid{
    gap:5px;
  }

  .weekday{
    font-size:9px;
    padding:6px 0;
  }

  .day{
    min-height:84px;
    padding:8px;
    border-radius:12px;
  }

  .num{
    font-size:14px;
  }

  .status{
    left:8px;
    right:5px;
    bottom:7px;
    font-size:9px;
    gap:5px;
  }

  .dot{
    width:6px;
    height:6px;
  }

  .footer{
    padding:0 12px 18px;
  }
}

/* ==============================
   PETITS TÉLÉPHONES
   ============================== */

@media(max-width:480px){

  body{
    padding:0;
  }

  .shell{
    border-radius:16px;
    box-shadow:none;
  }

  .top{
    padding:20px 14px 15px;
  }

  .eyebrow{
    font-size:10px;
  }

  h1{
    font-size:34px;
  }

  .subtitle{
    max-width:310px;
    font-size:12px;
  }

  .legend{
    padding:11px 14px;
    font-size:10px;
    justify-content:flex-start;
  }

  .wrap{
    padding:12px 5px 16px;
  }

  .weekdays,
  .grid{
    gap:3px;
  }

  .weekday{
    font-size:8px;
  }

  .day{
    min-height:68px;
    padding:6px;
    border-radius:9px;
  }

  .num{
    font-size:13px;
  }

  /*
  Sur les très petits écrans on retire
  les mots "Disponible / Réservé..."
  mais la couleur reste visible.
  */

  .status .label{
    display:none;
  }

  .status{
    left:6px;
    bottom:6px;
  }

  .dot{
    width:7px;
    height:7px;
  }
}
</style>

</head>

<body>

<div class="shell">

  <div class="top">

    <div>
      <div class="eyebrow">Rafa Pizza · Réservations</div>

      <h1 id="monthTitle">
        Septembre 2026
      </h1>

      <div class="subtitle">
        Cliquez sur la date souhaitée pour votre événement afin de faire une demande. 
        Nous vous répondrons dans un délai de 24 h.
      </div>
    </div>

    <div class="controls">
      <button class="active" data-month="8">Septembre</button>
      <button data-month="9">Octobre</button>
      <button data-month="10">Novembre</button>
    </div>

  </div>


  <div class="legend">

    <div class="legend-item">
      <span class="dot available"></span>
      Disponible
    </div>

    <div class="legend-item">
      <span class="dot booked-dot"></span>
      Réservé
    </div>

    <div class="legend-item">
      <span class="dot unavailable-dot"></span>
      Indisponible
    </div>

  </div>


  <div class="wrap">

    <div class="weekdays">

      <div class="weekday">Lun</div>
      <div class="weekday">Mar</div>
      <div class="weekday">Mer</div>
      <div class="weekday">Jeu</div>
      <div class="weekday">Ven</div>
      <div class="weekday">Sam</div>
      <div class="weekday">Dim</div>

    </div>

    <div id="calendarGrid" class="grid"></div>

  </div>


  <div class="footer">
    Les disponibilités peuvent changer rapidement.
  </div>

</div>


<script>

const YEAR = 2026;


/* ==================================================
   DISPONIBILITÉS

   Pour modifier ton calendrier,
   change SEULEMENT les chiffres ici.

   booked = réservé
   unavailable = indisponible
   ================================================== */

const availability = {

  8: {
    booked: [29,30],
    unavailable: []
  },

  9: {
    booked: [4,5],
    unavailable: []
  },

  10: {
    booked: [],
    unavailable: []
  }

};


/* ==================================================
   NE PAS MODIFIER EN DESSOUS
   ================================================== */


const monthNames = [
  "Janvier",
  "Février",
  "Mars",
  "Avril",
  "Mai",
  "Juin",
  "Juillet",
  "Août",
  "Septembre",
  "Octobre",
  "Novembre",
  "Décembre"
];


function mondayIndex(jsDay){
  return (jsDay + 6) % 7;
}


function getStatus(month,day){

  const d = availability[month] || {
    booked:[],
    unavailable:[]
  };

  if(d.booked.includes(day)){
    return "booked";
  }

  if(d.unavailable.includes(day)){
    return "unavailable";
  }

  return "available";
}


function getLabel(status){

  if(status === "booked"){
    return "Réservé";
  }

  if(status === "unavailable"){
    return "Indisponible";
  }

  return "Disponible";
}


/* ==================================================
   CRÉATION DU CALENDRIER
   ================================================== */

function render(month){

  const grid = document.getElementById("calendarGrid");

  document.getElementById("monthTitle").textContent =
    monthNames[month] + " " + YEAR;

  grid.innerHTML = "";


  const first = new Date(YEAR,month,1);

  const count =
    new Date(YEAR,month + 1,0).getDate();

  const offset =
    mondayIndex(first.getDay());


  /* CASES VIDES AVANT LE 1er */

  for(let i=0;i<offset;i++){

    const e = document.createElement("div");

    e.className = "day empty";

    grid.appendChild(e);

  }


  /* JOURS DU MOIS */

  for(let day=1; day<=count; day++){

    const status =
      getStatus(month,day);

    const c =
      document.createElement("div");


    c.className =
      "day " +
      status +
      (status === "available"
        ? " available-day"
        : "");


    let dotClass =
      status === "booked"
        ? "booked-dot"
        : status === "unavailable"
        ? "unavailable-dot"
        : "available";


    c.innerHTML =
      '<div class="num">' +
      day +
      '</div>' +

      '<div class="status">' +

      '<span class="dot ' +
      dotClass +
      '"></span>' +

      '<span class="label">' +
      getLabel(status) +
      '</span>' +

      '</div>';


    /* SEULEMENT LES DATES DISPONIBLES
       PEUVENT ÊTRE CLIQUÉES */

    if(status === "available"){

      c.setAttribute(
        "role",
        "button"
      );

      c.setAttribute(
        "tabindex",
        "0"
      );

      c.setAttribute(
        "aria-label",
        "Faire une demande pour le " +
        day +
        " " +
        monthNames[month] +
        " " +
        YEAR
      );


      c.addEventListener(
        "click",
        () => openReservation(day,month)
      );


      c.addEventListener(
        "keydown",
        (e)=>{

          if(
            e.key === "Enter" ||
            e.key === " "
          ){

            e.preventDefault();

            openReservation(
              day,
              month
            );

          }

        }
      );

    }


    grid.appendChild(c);

  }


  /* CASES VIDES À LA FIN */

  const trailing =
    (7 - ((offset + count) % 7)) % 7;


  for(let i=0;i<trailing;i++){

    const e =
      document.createElement("div");

    e.className =
      "day empty";

    grid.appendChild(e);

  }


  /* BOUTON DU MOIS ACTIF */

  document
    .querySelectorAll(
      "button[data-month]"
    )
    .forEach(
      b => b.classList.toggle(
        "active",
        Number(b.dataset.month) === month
      )
    );

}


/* CHANGEMENT DE MOIS */

document
  .querySelectorAll(
    "button[data-month]"
  )
  .forEach(
    b => b.addEventListener(
      "click",
      () => render(
        Number(b.dataset.month)
      )
    )
  );


/* AFFICHAGE INITIAL */

render(8);



/* ==================================================
   RÉSERVATION PAR COURRIEL
   ================================================== */

const RAFA_EMAIL =
  "lapizzaderafa@gmail.com";


function openReservation(day,month){

  const dateText =
    `${day} ${monthNames[month]} ${YEAR}`;


  const subject =
    `Demande de réservation Rafa Pizza — ${dateText}`;


  const body =
`Bonjour Rafa,

J'aimerais faire une demande de réservation pour le ${dateText}.

Nombre de personnes :
Ville / secteur :
Heure souhaitée :
Téléphone :

Merci!`;


  const mailto =
    "mailto:" +
    RAFA_EMAIL +
    "?subject=" +
    encodeURIComponent(subject) +
    "&body=" +
    encodeURIComponent(body);


  window.location.href = mailto;

}

</script>

</body>
</html>
