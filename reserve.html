<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rafa Pizza — Réservation</title><style>:root{--cream:#F6F0E7;--cream2:#FBF8F3;--wine:#5B1F2A;--wine2:#7A2D3C;--ink:#2B2524;--muted:#8A7D77;--line:rgba(91,31,42,.16)}*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.shell{max-width:760px;margin:auto;background:var(--cream);border:1px solid var(--line);border-radius:28px;overflow:hidden}.top,.date-section,.form-wrap{padding:26px 30px}.top,.date-section{border-bottom:1px solid var(--line)}.date-section{background:var(--cream2)}h1,h2,h3{font-family:Georgia,serif;color:var(--wine);font-weight:500}.main-title{margin:0}.back,.menu-link{color:var(--wine2);font-size:11px;font-weight:800;text-decoration:none}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:6px}.full,.menu-box{grid-column:1/-1}label{color:var(--wine);font-size:11px;font-weight:800}input,textarea,select{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:13px;padding:12px 13px;font-size:14px}textarea{min-height:100px}.menu-box{padding:17px;border:1px solid var(--line);border-radius:17px;background:var(--cream2)}.pizza-selects{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pizza-slot{display:flex;flex-direction:column;gap:6px}.custom-pizza{display:none}.custom-pizza.show{display:block}.submit,.home{margin-top:22px;width:100%;border:0;border-radius:999px;padding:14px 18px;background:var(--wine);color:white;font-weight:800}.message{display:none;margin-top:14px}.message.error{display:block;color:#8B3342}.confirmation{display:none;padding:40px 30px;text-align:center}.confirmation.show{display:block}.hidden-bot{position:absolute;left:-9999px}@media(max-width:650px){body{padding:4px}.shell{border-radius:20px}.top,.date-section,.form-wrap{padding-left:18px;padding-right:18px}.form-grid,.pizza-selects{grid-template-columns:1fr}.full,.menu-box{grid-column:auto}}</style></head><body><div class="shell"><div id="bookingPage"><div class="top"><h1 class="main-title">Rafa Pizza · Réservation</h1><a class="back" href="./index.html">← Retour au calendrier</a></div><section class="date-section"><h2 id="dateTitle">Chargement…</h2><p>Remplissez votre demande de réservation.</p></section><div class="form-wrap"><form id="reservationForm"><div class="hidden-bot"><input id="website"></div><div class="form-grid"><div class="field"><label>Nom complet *</label><input id="fullName" required></div><div class="field"><label>Courriel *</label><input id="email" type="email" required></div><div class="field"><label>Téléphone *</label><input id="phone" required></div><div class="field"><label>Nombre de personnes *</label><input id="guestCount" type="number" min="1" max="100" required></div><div class="field"><label>Ville / secteur *</label><input id="city" required></div><div class="field"><label>Heure souhaitée *</label><input id="preferredTime" type="time" required></div><section class="menu-box"><h3>Votre menu · 4 pizzas</h3><p>Choisissez simplement 4 sortes. Vous pourrez toujours ajuster votre menu avec Rafa par la suite.</p><a class="menu-link" href="./index.html#pizzas">Voir les photos →</a><div id="pizzaSelects" class="pizza-selects"></div></section><div class="field full"><label>Notes ou préférences</label><textarea id="notes"></textarea></div></div><button id="submitButton" class="submit">Soumettre ma réservation</button><div id="errorMessage" class="message"></div></form></div></div><div id="confirmation" class="confirmation"><h2>Date réservée ✓</h2><p id="confirmationText"></p><a class="home" href="./index.html">Retour au calendrier</a></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const YEAR=2026,SUPABASE_URL="https://jetogsbyptglaihktdel.supabase.co",SUPABASE_KEY="sb_publishable_YQndqxq2W7Bq2C-0crv0rQ_V4Upvbja",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),monthNames=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"],PIZZAS=["Margherita","’Nduja e miel","New York","Parma","Golosa","Cipolla","Quattro","Fungus","Figus","Montréal","Jardin","Mortadella"];const params=new URLSearchParams(location.search),day=+params.get("day"),month=+params.get("month"),form=document.getElementById("reservationForm"),submitButton=document.getElementById("submitButton"),errorMessage=document.getElementById("errorMessage");function isoDate(){return `${YEAR}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`}function formattedDate(){return `${day} ${monthNames[month]} ${YEAR}`}function showError(t){errorMessage.textContent=t;errorMessage.className="message error"}function buildMenuSelectors(){let saved=JSON.parse(localStorage.getItem("rafaPizzaChoices")||"[]").slice(0,4);for(let i=0;i<4;i++){let slot=document.createElement("div");slot.className="pizza-slot";let lab=document.createElement("label");lab.textContent=`Choix ${i+1} *`;let sel=document.createElement("select");sel.id=`pizza${i+1}`;sel.required=true;sel.innerHTML='<option value="">Choisir une pizza</option>'+PIZZAS.map(p=>`<option>${p}</option>`).join('')+'<option value="__other__">Autre — proposer ma propre pizza</option>';if(saved[i]&&PIZZAS.includes(saved[i]))sel.value=saved[i];let custom=document.createElement("input");custom.id=`customPizza${i+1}`;custom.className="custom-pizza";custom.placeholder="Décrivez votre pizza";sel.onchange=()=>{custom.classList.toggle("show",sel.value==="__other__");custom.required=sel.value==="__other__"};slot.append(lab,sel,custom);pizzaSelects.append(slot)}}buildMenuSelectors();function getMenu(){return[1,2,3,4].map(i=>{let s=document.getElementById(`pizza${i}`),c=document.getElementById(`customPizza${i}`);return s.value==="__other__"?c.value.trim():s.value})}function validateMenu(){let raw=[1,2,3,4].map(i=>document.getElementById(`pizza${i}`).value);if(raw.some(v=>!v)){showError("Choisissez vos 4 pizzas avant d’envoyer la réservation.");return false}let named=raw.filter(v=>v!=="__other__");if(new Set(named).size!==named.length){showError("Choisissez quatre sortes différentes.");return false}return true}async function init(){dateTitle.textContent=formattedDate();let{data}=await supabaseClient.rpc("get_calendar_blocks");if((data||[]).some(r=>r.event_date===isoDate())){showError("Cette date vient malheureusement d’être réservée.");form.style.display="none"}}init();form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity()||!validateMenu())return;submitButton.disabled=true;let menu=getMenu(),notes=document.getElementById("notes").value.trim(),payload={p_event_date:isoDate(),p_full_name:fullName.value.trim(),p_email:email.value.trim(),p_phone:phone.value.trim(),p_guest_count:+guestCount.value,p_city:city.value.trim(),p_preferred_time:preferredTime.value,p_message:(notes?notes+"\n\n":"")+"Menu (4 choix): "+menu.join(" | "),p_website:website.value.trim()};try{let{data,error}=await supabaseClient.rpc("create_reservation",payload);if(error)throw error;if(data&&data.ok===true){localStorage.setItem("rafaPizzaChoices",JSON.stringify(menu.filter(x=>PIZZAS.includes(x))));bookingPage.style.display="none";confirmation.classList.add("show");confirmationText.textContent=`Votre demande pour le ${formattedDate()} a bien été enregistrée. Rafa vous contactera pour confirmer les détails.`;try{await fetch("https://formsubmit.co/ajax/lapizzaderafa@gmail.com",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:"🍕 Nouvelle réservation Rafa Pizza — "+formattedDate(),_template:"table",_replyto:payload.p_email,"Date de l'événement":formattedDate(),"Nom du client":payload.p_full_name,"Courriel du client":payload.p_email,"Téléphone":payload.p_phone,"Nombre de personnes":payload.p_guest_count,"Ville / secteur":payload.p_city,"Heure souhaitée":payload.p_preferred_time,"Menu choisi":menu.join(" · "),"Notes / préférences":notes||"Aucune note"})})}catch(_){}return}showError("La réservation n’a pas pu être enregistrée. Réessayez.")}catch(err){showError("Une erreur est survenue. Réessayez.")}finally{submitButton.disabled=false}};</script></body></html>
