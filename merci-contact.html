<title>Message transmis — Rafa Pizza</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#FAF9F6;color:#242321;font-family:'Instrument Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:1480px;margin:auto;padding:27px clamp(23px,5vw,78px)}
header a{font-size:12px;letter-spacing:.07em;font-weight:500;color:inherit;text-decoration:none}
main{max-width:1480px;margin:0 auto;padding:clamp(87px,13vw,185px) clamp(23px,5vw,78px) 100px;min-height:75vh}

.actions{margin-top:62px}
.actions a{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:14px 30px;border:1px solid #302B27;border-radius:100px;font-size:12px;letter-spacing:.055em;text-transform:uppercase;text-decoration:none;color:#302B27;font-weight:500}
.actions a:hover{background:#302B27;color:#FAF9F6}
.actions a:focus-visible{outline:2px solid #5B1F2A;outline-offset:4px}
footer{max-width:1480px;margin:auto;padding:28px clamp(23px,5vw,78px);color:#877E76;font-size:11px;border-top:1px solid #E8E3DD}

<header><a href="./index.html">RAFA PIZZA</a></header>
<main>
<p class="eyebrow">Nous contacter</p>

<div class="actions"><a href="./index.html">Retour à l’accueil</a></div>
