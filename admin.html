<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rafa Pizza — Administration</title>
<style>
html,body{margin:0;min-height:100%;background:#eee8df;color:#5B1F2A;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot-card{background:#F6F0E7;border:1px solid rgba(91,31,42,.16);border-radius:24px;padding:28px;box-shadow:0 14px 34px rgba(65,35,39,.08)}.boot-title{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:800}.boot-note{margin-top:8px;font-size:12px;color:#8A7D77}.boot-error{max-width:560px;line-height:1.55;color:#8a2f40}
</style>
</head>
<body>
<div id="boot" class="boot"><div class="boot-card"><div class="boot-title">Rafa Pizza</div><div class="boot-note">Chargement du tableau de bord…</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('./admin-original.html?v=20260915-email-hook-1',{cache:'no-store'});
    if(!response.ok) throw new Error('admin_source_unavailable');
    let html=await response.text();
    const marker='\nsessionGate();';
    const pos=html.lastIndexOf(marker);
    if(pos<0) throw new Error('admin_hook_marker_missing');

    const hook="\n\nasync function sendRafaConfirmationEmail(reservationId){\n  const {data,error}=await db.functions.invoke('send-confirmation',{\n    body:{reservation_id:reservationId}\n  });\n\n  if(error){\n    let code=error.message||'send_failed';\n    try{\n      const context=error.context;\n      if(context&&typeof context.clone==='function'){\n        const details=await context.clone().json();\n        code=(details&&details.error)||code;\n      }\n    }catch(_error){}\n    return {ok:false,code};\n  }\n\n  if(!data||data.ok!==true){\n    return {ok:false,code:(data&&data.error)||'send_failed'};\n  }\n\n  return Object.assign({ok:true},data);\n}\n\nfunction rafaConfirmationErrorText(code){\n  const messages={\n    gmail_not_configured:'Les accès Gmail ne sont pas encore disponibles dans Supabase.',\n    gmail_token_failed:'Google a refusé la connexion Gmail. Le jeton OAuth doit être renouvelé.',\n    gmail_send_failed:'Gmail a refusé l’envoi du courriel.',\n    client_email_missing:'Aucune adresse courriel client n’est enregistrée.',\n    menu_token_missing:'Le lien privé du menu n’a pas pu être généré.',\n    unauthorized:'Ta session admin a expiré. Reconnecte-toi puis réessaie.',\n    sent_but_tracking_failed:'Le courriel semble être parti, mais son statut n’a pas pu être enregistré.'\n  };\n  return messages[code]||('Le courriel n’a pas pu être envoyé ('+code+').');\n}\n\n$('approveBtn').onclick=async()=>{\n  if(!editing||!isRealEvent(editing)) return;\n\n  const ok=confirm('Accepter cette réservation? Le client recevra automatiquement le courriel de confirmation avec le lien pour choisir ses 4 pizzas.');\n  if(!ok) return;\n\n  $('approveBtn').disabled=true;\n  $('status').value='confirmed';\n\n  const success=await saveReservation({\n    closeAfter:false,\n    forcedStatus:'confirmed'\n  });\n\n  if(!success){\n    $('approveBtn').disabled=false;\n    return;\n  }\n\n  $('formMsg').innerHTML='<div class=\"success\">Réservation confirmée ✅<br>Envoi du courriel au client…</div>';\n\n  const mailResult=await sendRafaConfirmationEmail(editing.id);\n\n  if(mailResult.ok){\n    await loadData();\n    const refreshed=reservations.find(r=>r.id===editing.id);\n    if(refreshed) editing=refreshed;\n    $('menuSent').checked=true;\n    $('formMsg').innerHTML='<div class=\"success\">Réservation confirmée ✅<br>Courriel de confirmation envoyé au client ✅<br>Le lien privé lui permet de choisir ses 4 pizzas.</div>';\n  }else{\n    $('formMsg').innerHTML='<div class=\"error\"><strong>Réservation confirmée ✅</strong><br>Par contre, le courriel n’a pas été envoyé.<br>'+escapeHtml(rafaConfirmationErrorText(mailResult.code))+'</div>';\n  }\n\n  $('approveBtn').classList.add('hidden');\n  $('approveBtn').disabled=false;\n  $('invoiceBtn').classList.toggle('hidden',!canGenerateInvoice(editing));\n};\n";

    html=html.slice(0,pos)+hook+html.slice(pos);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('boot').innerHTML='<div class="boot-card boot-error"><div class="boot-title">Rafa Pizza</div><p>Le tableau de bord n’a pas pu se charger. Recharge la page.</p></div>';
  }
})();
</script>
</body>
</html>
