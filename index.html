<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier Rafa — Automne 2026</title>

<style>
:root{
  --cream:#F6F0E7;
  --cream2:#FBF8F3;
  --wine:#5B1F2A;
  --wine2:#7A2D3C;
  --ink:#2B2524;
  --muted:#8A7D77;
  --line:rgba(91,31,42,.16);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink)
}

body{padding:12px}

.shell{
  max-width:1080px;
  margin:auto;
  background:var(--cream);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:0 18px 45px rgba(65,35,39,.10);
  overflow:hidden
}

.top{
  padding:28px 30px 18px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--wine2);
  font-weight:700
}

h1{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--wine);
  font-size:clamp(34px,5vw,58px);
  line-height:.95;
  margin:6px 0 0;
  font-weight:500
}

.subtitle{
  margin-top:8px;
  color:var(--muted);
  font-size:14px
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

button{
  border:1px solid var(--line);
  background:var(--cream2);
  color:var(--wine);
  border-radius:999px;
  padding:10px 15px;
  font-size:13px;
  font-weight:700;
  cursor:pointer
}

button.active{
  background:var(--wine);
  color:var(--cream2);
  border-color:var(--wine)
}

.legend{
  padding:14px 30px;
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--muted);
  border-bottom:1px solid var(--line)
}

.legend-item{
  display:flex;
  align-items:center;
  gap:7px
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block
}

.available{background:var(--wine2)}
.booked-dot{background:var(--wine)}
.unavailable-dot{background:#B9ADA6}

.wrap{
  padding:22px 24px 26px
}

.weekdays,
.grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px
}

.weekdays{
  margin-bottom:8px
}

.weekday{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:7px 2px
}

.day{
  min-height:118px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.35);
  padding:12px;
  position:relative;
  transition:.18s ease
}

.day.available-day{
  cursor:pointer
}

.day.available-day:hover{
  border-color:rgba(91,31,42,.35)
}

.day:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(65,35,39,.08)
}

.day.empty{
  background:transparent;
  border:1px dashed rgba(91,31,42,.08);
  box-shadow:none;
  transform:none
}

.num{
  font-size:16px;
  font-weight:800;
  color:var(--wine)
}

.status{
  position:absolute;
  left:12px;
  right:12px;
  bottom:11px;
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  font-weight:800
}

.day.booked{
  background:var(--wine);
  border-color:var(--wine)
}

.day.booked .num,
.day.booked .status{
  color:var(--cream2)
}

.day.booked .dot{
  background:var(--cream2)
}

.day.unavailable{
  background:rgba(185,173,166,.18)
}

.day.unavailable .num,
.day.unavailable .status{
  color:#8B817C
}

/* IMPORTANT :
   vrai lien invisible qui couvre toute la date */
.day-link{
  position:absolute;
  inset:0;
  z-index:10;
  display:block;
  border-radius:inherit;
  text-decoration:none;
  background:transparent;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.day-link:focus-visible{
  outline:2px solid var(--wine2);
  outline-offset:-3px
}

.cta{
  margin:0 24px 24px;
  border-radius:18px;
  background:var(--cream2);
  border:1px solid var(--line);
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px
}

.cta strong{
  display:block;
  color:var(--wine);
  font-family:Georgia,"Times New Roman",serif;
  font-size:20px;
  font-weight:500;
  margin-bottom:3px
}

.cta span{
  color:var(--muted);
  font-size:13px
}

.badge{
  white-space:nowrap;
  background:var(--wine);
  color:var(--cream2);
  border-radius:999px;
  padding:11px 16px;
  font-size:12px;
  font-weight:800;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:.18s ease
}

.badge:hover{
  transform:translateY(-1px);
  box-shadow:0 7px 16px rgba(91,31,42,.16)
}

.footer{
  padding:0 24px 22px;
  color:var(--muted);
  font-size:11px;
  text-align:center
}

@media(max-width:760px){

  body{padding:4px}

  .shell{border-radius:20px}

  .top{
    padding:22px 18px 16px;
    align-items:flex-start;
    flex-direction:column
  }

  .legend{padding:12px 18px}

  .wrap{padding:14px 10px 18px}

  .weekdays,
  .grid{gap:5px}

  .weekday{font-size:9px}

  .day{
    min-height:86px;
    padding:8px;
    border-radius:12px
  }

  .num{font-size:13px}

  .status{
    left:8px;
    right:8px;
    bottom:7px;
    font-size:9px;
    gap:5px
  }

  .dot{
    width:6px;
    height:6px
  }

  .cta{
    margin:0 10px 14px;
    padding:14px;
    align-items:flex-start;
    flex-direction:column
  }

  .footer{
    padding:0 12px 16px
  }
}

@media(max-width:480px){

  .status .label{
    display:none
  }

  .day{
    min-height:76px
  }
}
</style>
</head>

<body>

<div class="shell">

  <div class="top">
    <div>
      <div class="eyebrow">Rafa Pizza · Réservations</div>

      <h1 id="monthTitle">
        Septembre 2026
      </h1>

      <div class="subtitle">
        Choisissez votre date pour votre prochaine soirée pizza.
      </div>
    </div>

    <div class="controls">
      <button class="active" data-month="8">Septembre</button>
      <button data-month="9">Octobre</button>
      <button data-month="10">Novembre</button>
    </div>
  </div>


  <div class="legend">

    <div class="legend-item">
      <span class="dot available"></span>
      Disponible
    </div>

    <div class="legend-item">
      <span class="dot booked-dot"></span>
      Réservé
    </div>

    <div class="legend-item">
      <span class="dot unavailable-dot"></span>
      Indisponible
    </div>

  </div>


  <div class="wrap">

    <div class="weekdays">
      <div class="weekday">Lun</div>
      <div class="weekday">Mar</div>
      <div class="weekday">Mer</div>
      <div class="weekday">Jeu</div>
      <div class="weekday">Ven</div>
      <div class="weekday">Sam</div>
      <div class="weekday">Dim</div>
    </div>

    <div id="calendarGrid" class="grid"></div>

  </div>


  <div class="cta">

    <div>
      <strong>Une date vous intéresse?</strong>
      <span>Écrivez-nous pour réserver votre soirée.</span>
    </div>

    <a
      class="badge reserve-btn"
      id="reserveBtn"
      href="#"
      target="_top"
      rel="noopener"
    >
      Réserver
    </a>

  </div>


  <div class="footer">
    Les disponibilités peuvent changer rapidement.
  </div>

</div>


<script>

const YEAR = 2026;

const RAFA_EMAIL = "lapizzaderafa@gmail.com";


/* ==========================================
   MODIFIE SEULEMENT CES LISTES
========================================== */

const availability = {

  8: {
    booked: [],
    unavailable: []
  },

  9: {
    booked: [],
    unavailable: []
  },

  10: {
    booked: [],
    unavailable: []
  }

};


const monthNames = [
  "Janvier",
  "Février",
  "Mars",
  "Avril",
  "Mai",
  "Juin",
  "Juillet",
  "Août",
  "Septembre",
  "Octobre",
  "Novembre",
  "Décembre"
];


/* ==========================================
   DÉTECTION FACEBOOK / INSTAGRAM
========================================== */

function isMetaBrowser(){

  const ua =
    navigator.userAgent ||
    navigator.vendor ||
    "";

  return /FBAN|FBAV|FB_IAB|Instagram|Messenger/i.test(ua);
}


/* ==========================================
   CRÉATION DU LIEN DE RÉSERVATION
========================================== */

function reservationUrl(day=null, month=null){

  const hasDate =
    day !== null &&
    month !== null;


  const dateText =
    hasDate
      ? `${day} ${monthNames[month]} ${YEAR}`
      : "";


  const subject =
    hasDate
      ? `Réservation Rafa Pizza — ${dateText}`
      : "Réservation Rafa Pizza";


  const body =
    hasDate

      ? `Bonjour Rafa,

J'aimerais réserver une soirée Rafa Pizza le ${dateText}.

Nombre de personnes :
Ville / secteur :
Heure souhaitée :
Téléphone :

Merci!`

      : `Bonjour Rafa,

J'aimerais réserver une soirée Rafa Pizza.

Date souhaitée :
Nombre de personnes :
Ville / secteur :
Heure souhaitée :
Téléphone :

Merci!`;


  /*
     FACEBOOK / INSTAGRAM

     Leur navigateur intégré peut bloquer mailto:.

     On utilise donc une vraie URL HTTPS vers Gmail.
  */

  if(isMetaBrowser()){

    return (
      "https://mail.google.com/mail/?view=cm&fs=1" +
      "&to=" + encodeURIComponent(RAFA_EMAIL) +
      "&su=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(body)
    );

  }


  /*
     SAFARI / CHROME / NAVIGATEUR NORMAL

     On utilise mailto: pour ouvrir l'application
     de courriel installée sur le téléphone.
  */

  return (
    "mailto:" +
    RAFA_EMAIL +
    "?subject=" +
    encodeURIComponent(subject) +
    "&body=" +
    encodeURIComponent(body)
  );

}


/* ==========================================
   CALENDRIER
========================================== */

function mondayIndex(jsDay){
  return (jsDay+6)%7;
}


function getStatus(month,day){

  const d =
    availability[month] ||
    {
      booked:[],
      unavailable:[]
    };


  if(d.booked.includes(day)){
    return "booked";
  }


  if(d.unavailable.includes(day)){
    return "unavailable";
  }


  return "available";
}


function getLabel(status){

  if(status==="booked"){
    return "Réservé";
  }


  if(status==="unavailable"){
    return "Indisponible";
  }


  return "Disponible";
}


function render(month){

  const grid =
    document.getElementById(
      "calendarGrid"
    );


  document.getElementById(
    "monthTitle"
  ).textContent =
    monthNames[month] +
    " " +
    YEAR;


  grid.innerHTML="";


  const first =
    new Date(
      YEAR,
      month,
      1
    );


  const count =
    new Date(
      YEAR,
      month+1,
      0
    ).getDate();


  const offset =
    mondayIndex(
      first.getDay()
    );


  /* Cases vides avant le 1er */

  for(let i=0;i<offset;i++){

    const e =
      document.createElement("div");

    e.className =
      "day empty";

    grid.appendChild(e);

  }


  /* Dates */

  for(let day=1;day<=count;day++){

    const status =
      getStatus(
        month,
        day
      );


    const c =
      document.createElement(
        "div"
      );


    c.className =
      "day " +
      status +
      (
        status==="available"
          ? " available-day"
          : ""
      );


    const dotClass =
      status==="booked"
        ? "booked-dot"

        : status==="unavailable"
        ? "unavailable-dot"

        : "available";


    c.innerHTML =
      '<div class="num">' +
      day +
      '</div>' +

      '<div class="status">' +

      '<span class="dot ' +
      dotClass +
      '"></span>' +

      '<span class="label">' +
      getLabel(status) +
      '</span>' +

      '</div>';


    /*
       IMPORTANT

       On ne fait PLUS :
       addEventListener("click", openReservation)

       On place un VRAI lien directement
       sur la case.

       Le clic provient donc réellement
       du doigt de l'utilisateur.
    */

    if(status==="available"){

      const link =
        document.createElement(
          "a"
        );


      link.className =
        "day-link";


      link.href =
        reservationUrl(
          day,
          month
        );


      /*
         _top fait sortir le lien
         de l'iframe Google Sites.
      */

      link.target =
        "_top";


      link.rel =
        "noopener";


      link.setAttribute(
        "aria-label",
        "Réserver le " +
        day +
        " " +
        monthNames[month] +
        " " +
        YEAR
      );


      c.appendChild(link);

    }


    grid.appendChild(c);

  }


  /* Cases vides après la dernière date */

  const trailing =
    (
      7 -
      (
        (offset+count)%7
      )
    )%7;


  for(let i=0;i<trailing;i++){

    const e =
      document.createElement(
        "div"
      );

    e.className =
      "day empty";

    grid.appendChild(e);

  }


  document
    .querySelectorAll(
      "button[data-month]"
    )
    .forEach(b => {

      b.classList.toggle(
        "active",
        Number(
          b.dataset.month
        )===month
      );

    });

}


/* ==========================================
   CHANGER DE MOIS
========================================== */

document
  .querySelectorAll(
    "button[data-month]"
  )
  .forEach(b => {

    b.addEventListener(
      "click",
      () => {

        render(
          Number(
            b.dataset.month
          )
        );

      }
    );

  });


/* ==========================================
   BOUTON RÉSERVER EN BAS

   Lui aussi est maintenant un vrai lien.
========================================== */

const reserveBtn =
  document.getElementById(
    "reserveBtn"
  );


reserveBtn.href =
  reservationUrl();


/* ==========================================
   SEPTEMBRE AU DÉPART
========================================== */

render(8);

</script>

</body>
</html>
